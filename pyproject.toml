[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-pipeline"
version = "0.1.0"
description = "Multi-vendor product catalogue pipeline (PySpark + Delta Lake)"
requires-python = ">=3.11"
dependencies = [
    # Compatible pair per Delta's compatibility table: Delta 3.3.x <-> Spark 3.5.x
    "pyspark==3.5.9",
    "delta-spark==3.3.3",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
